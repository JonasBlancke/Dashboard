# ── Live Forecast city registry ─────────────────────────────────────────
# This file IS the list of cities the daily forecast + the Release-staging
# script iterate over. Add a city = one block here, then:
#   1. cache its merit_height_m (one Earth-Engine lookup, done once)
#   2. make sure ML-UrbanHeat has, for that city:
#        cities/<Name>/processed_data/<spatial_sim>/spatial/   (resampled TIFs
#          + default_grid.tif; `spatial_sim` defaults to `simulation_name`)
#        cities/<Name>/raw_data/AOI.geojson   (required — clips the grid)
#        cities/<Name>/raw_data/ZOI.geojson   (optional — red outline only)
#   3. run `bash scripts/stage_v29_assets.sh`  (stages every enabled city)
# No code changes.

cities:
  ghent:
    ml_urbanheat_city_name: Ghent      # key in ML-UrbanHeat/city_id_converter.json
    display_name: Ghent
    country: Belgium
    timezone: Europe/Brussels
    center: { lat: 51.054, lon: 3.717 }
    has_local_observations: true
    value_domain_c: null              # auto from the shown frames (min span 5 °C); set [lo, hi] to pin
    merit_height_m: 11.44935881561851  # cached — skips the Earth Engine lookup
    enabled: true

  patras:
    ml_urbanheat_city_name: Patras
    display_name: Patras
    country: Greece
    timezone: Europe/Athens
    center: { lat: 38.292, lon: 21.788 }
    has_local_observations: true
    value_domain_c: null
    merit_height_m: 53.904681672197675  # from cities/Patras/raw_data/era5/era5_grid_heights.json
    spatial_sim: V29_bf1000m_gradual    # its V29 resampled TIFs live under this sim, not V29_forecast
    # Patras' AOI spans ~0..1900 m — the city-centre-only t2m_lrc baseline
    # leaves mountain pixels ~8-9 °C too warm. Use the per-pixel lapse-rate
    # model instead (see ML-UrbanHeat configs/V29_forecast_lrc_pixel.yaml).
    simulation_name: V29_forecast_lrc_pixel
    config_path: configs/V29_forecast_lrc_pixel.yaml
    enabled: true

defaults:
  simulation_name: V29_forecast
  config_path: configs/V29_forecast.yaml
  forecast_days: 16                    # ECMWF-IFS horizon via Open-Meteo
  warmup_hours: 24                     # matches the model's rolling windows — do not change
  frame_hours: 72                      # hourly map PNGs for the coming N hours
