name: deploy-site

# Publish ONLY the Live Forecast tab to GitHub Pages.
#
# The repo's frontend/ is the full 3-tab dashboard (UTCI / EPW / Live Forecast) —
# that stays intact for local dev via Flask. For Pages we:
#   1. ship frontend/ + the committed data/forecast/ build
#      (data/epw/ and data/story/ are NOT fetched — those tabs are hidden)
#   2. rewrite absolute /css /js /vendor /data paths to relative so it works
#      under the jonasblancke.github.io/Dashboard subpath
#   3. inject a snippet that hides the UTCI + EPW tabs and force-opens Live
#      Forecast, and drop epw.js

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "data/forecast/**"
  workflow_run:
    workflows: ["daily-forecast"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Live-Forecast-only site
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          cp -r frontend/* _site/
          rm -f _site/js/epw.js
          mkdir -p _site/data
          cp -r data/forecast _site/data/
          rm -rf _site/data/forecast/_spatial

          # app.js's init() bails before wiring the tab handlers if the story
          # index 404s — ship an empty one so it runs through and the Live
          # Forecast tab works. (UTCI/EPW panels are hidden below anyway.)
          mkdir -p _site/data/story/heatstress
          echo '{"cities":[]}' > _site/data/story/heatstress/index.json

          # absolute "/css/…" "/js/…" "/vendor/…" "/data/…" -> relative. The
          # frontend routes with query + hash only (no path segments), so a
          # relative ref always resolves against the site root. The char class
          # matches the delimiter right before the slash: " ' ` ( = , or space.
          # app.js's Forecast module resolves MapLibre image URLs through its own
          # baseHref() helper, which handles both the leading-slash (dev) and the
          # relative (this rewrite) forms — no extra JS surgery needed.
          grep -rlZ -E $'["\x27`(=, ]/(css|js|vendor|data)/' _site \
               --include='*.html' --include='*.js' --include='*.css' \
            | xargs -0 -r sed -i -E 's#([]"'"'"'`(=, ])/(css|js|vendor|data)/#\1\2/#g'
          echo "remaining absolute refs (should be none):"
          ! grep -rn -E $'[]"\x27`(=, ]/(css|js|vendor|data)/' _site \
               --include='*.html' --include='*.js' --include='*.css'

          # forecast-only: drop the epw.js tag, hide the other two tabs/panels,
          # retitle, and force the Live Forecast tab open on load.
          sed -i -E '/<script[^>]*\bsrc="js\/epw\.js"/d' _site/index.html
          sed -i 's#<title>[^<]*</title>#<title>Live Urban Temperature Forecast</title>#' _site/index.html
          python - <<'PY'
          import pathlib, re
          p = pathlib.Path("_site/index.html")
          html = p.read_text(encoding="utf-8")
          inject = """
            <style>
              #tabs .tab[data-tab="utci"], #tabs .tab[data-tab="epw"],
              .panel[data-panel="utci"], .panel[data-panel="epw"] { display: none !important; }
            </style>
            <script>
              addEventListener("DOMContentLoaded", function () {
                if (!location.hash.includes("tab=live")) {
                  location.hash = "tab=live" + location.hash.replace(/^#/, "&").replace(/^&$/, "");
                }
                var t = setInterval(function () {
                  var b = document.querySelector('#tabs .tab[data-tab="live"]');
                  if (b) { clearInterval(t); if (!b.classList.contains("is-active")) b.click(); }
                }, 50);
              });
            </script>
          """
          html = html.replace("</head>", inject + "</head>", 1)
          p.write_text(html, encoding="utf-8")
          print("injected forecast-only snippet")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
